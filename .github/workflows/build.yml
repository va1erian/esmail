name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # See ci.yml's build-linux job for why this list is short.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esmail-linux
          path: target/release/esmail

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release
        env:
          RUST_BACKTRACE: 1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path esmail-windows
          Copy-Item "target/release/esmail.exe" -Destination "esmail-windows/"
          Get-ChildItem "target/release/*.dll" | Copy-Item -Destination "esmail-windows/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "esmail-windows/*" -DestinationPath "esmail-windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esmail-windows
          path: esmail-windows.zip

  create-release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: esmail-linux
          path: ./artifacts/linux
          
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: esmail-windows
          path: ./artifacts/windows

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/linux/esmail
            ./artifacts/windows/esmail-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
