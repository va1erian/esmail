name: CI

on:
  pull_request:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # litehtml's `cc`-crate build only needs a C/C++ compiler
      # (build-essential) and pkg-config (probed by openssl-sys and
      # wayland-sys); nothing here needs bindgen/libclang since the crate
      # ships pre-generated FFI bindings by default. libssl-dev is for
      # native-tls (async-imap/lettre), and libdbus-1-dev is for keyring's
      # Linux secret-service backend. Verified by a clean `cargo build
      # --workspace` / `cargo test --workspace --no-run` against exactly this
      # package set in a bare rust:slim-bookworm container.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      # The library must not drag in a frontend toolkit: a non-egui consumer
      # (the future esmail-win32 crate) turns `egui-frontend` off. Fails the
      # job if egui, eframe, glow or epaint show up in the normal dependency
      # tree without the feature.
      - name: Check the library without the egui frontend
        run: |
          cargo check --lib -p esmail --no-default-features
          if cargo tree -p esmail --no-default-features -e normal | grep -i -E "egui|eframe|glow|epaint"; then
            echo "::error::the esmail library still depends on egui with egui-frontend off"
            exit 1
          fi

      - name: Run unit tests
        run: cargo test --workspace

      # mail-mock-server's TLS identity is a committed, throwaway test
      # certificate (crates/mail-mock-server/certs/) -- trusting its CA as
      # an extra system root lets esmail's real (unmodified) TLS code in
      # imap.rs connect to it, the same way it would a real IMAPS server.
      # See crates/mail-mock-server/README.md for the full rationale and
      # for how to do this on a local dev machine instead of CI.
      - name: Trust the mail-mock-server test CA
        run: |
          sudo cp crates/mail-mock-server/certs/ca.crt /usr/local/share/ca-certificates/esmail-test-ca.crt
          sudo update-ca-certificates

      - name: Run IMAP/SMTP simulation tests (esmail against mail-mock-server)
        run: cargo test --workspace -- --include-ignored
        env:
          ESMAIL_TEST_CA_TRUSTED: "1"

  # Build-only on Windows: trusting an extra root CA there means the
  # Windows certificate store, not a files-on-disk step like Linux's
  # update-ca-certificates, and whether that's reliably non-interactive on
  # a hosted runner wasn't confirmed -- see
  # crates/mail-mock-server/README.md's Windows section for the (manual,
  # interactive, already-approved-once-for-this-repo) local-dev version.
  # The IMAP/SMTP simulation suite itself is platform-agnostic Rust, so
  # build-linux's coverage already exercises the code paths that matter.
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build
        env:
          RUST_BACKTRACE: 1

      # See build-linux: the library has no egui once `egui-frontend` is off.
      - name: Check the library without the egui frontend
        shell: pwsh
        run: |
          cargo check --lib -p esmail --no-default-features
          $tree = cargo tree -p esmail --no-default-features -e normal
          $matches = $tree | Select-String -Pattern 'egui|eframe|glow|epaint'
          if ($matches) {
            Write-Error "the esmail library still depends on egui with egui-frontend off:`n$($matches -join "`n")"
            exit 1
          }
