[package]
name = "esmail-glue"
description = "The frontend-independent layer between esMail's mail core and a window: the runtime, the account sessions, the cache, sending and settings. Shared by the Windows and LazyOS frontends."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["native-tls", "os-keyring"]
# Passed through to the core; see crates/esmail/Cargo.toml.
native-tls = ["esmail/native-tls"]
rustls = ["esmail/rustls"]
os-keyring = ["esmail/os-keyring"]

[dependencies]
# Names no UI type: no win32ui, egui or xui.
esmail = { path = "../esmail", default-features = false }
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
# Opens the Google sign-in page in the default browser.
opener.workspace = true
secrecy.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
# Remote images; the TLS settings come from `esmail::tls`.
ureq.workspace = true

[dev-dependencies]
env_logger.workspace = true
mail-mock-server = { path = "../mail-mock-server" }
