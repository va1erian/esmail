# Tray icon + Windows toast notifications (B10). Windows-only: neither crate
# is even compiled on other platforms, let alone linked.
#
# `keyring`'s real platform credential stores are all opt-in Cargo features
# (see keyring-3.x's [features]: no `default` list at all) -- with none
# enabled, `keyring` silently falls back to its in-memory-only `mock` store
# on every platform (keyring-3.x's own src/lib.rs: `#[cfg(all(target_os =
# "windows", not(feature = "windows-native")))] pub use mock as default;`,
# and the equivalent for Linux/macOS). The base `keyring.workspace = true`
# above carried no such feature, so `secrets::set_password`/`get_password`
# were quietly talking to a store that: a) `MockCredentialBuilder::build`'s
# own doc comment says "keeps the password in the entry" -- and
# `secrets::entry()` builds a brand-new `keyring::Entry` on every call, so
# even a `get_password` moments after a `set_password` in the *same*
# session returned nothing; and b) never touched the real OS keychain, so
# nothing could have survived a restart either way. This is the actual
# cause of "the password doesn't appear to be saved" -- see the GitHub
# issue this was filed against. Fixed by requesting the real backend per
# platform.
[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
windows.workspace = true
keyring = { workspace = true, features = ["windows-native"] }
windows-registry.workspace = true

# Secret Service (gnome-keyring/kwallet over D-Bus) -- matches the
# `libdbus-1-dev` package `.github/workflows/build.yml`'s Linux job already
# installs for other reasons, so this needs no new CI dependency.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }

# Not built by this repo's CI today, but included so a macOS build gets a
# real keychain instead of silently inheriting the mock fallback too.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[dev-dependencies]
mail-mock-server = { path = "../mail-mock-server" }

# `build.rs` only calls into this when targeting Windows; the crate itself is
# plain Rust and builds everywhere.
[build-dependencies]
winresource.workspace = true
