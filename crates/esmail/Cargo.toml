[package]
name = "esmail"
description = "The egui-free mail core behind the esMail frontends: IMAP/SMTP actors, the SQLite cache and HTML sanitizing."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "esmail"
path = "src/lib.rs"

[features]
default = ["native-tls", "os-keyring"]
# TLS for IMAP, SMTP and HTTPS through the platform's own library (SChannel on
# Windows, OpenSSL elsewhere); HTTPS keeps ureq's rustls with `ring`.
native-tls = ["dep:tokio-native-tls", "lettre/tokio1-native-tls", "ureq/rustls"]
# TLS through rustls with no crypto provider of its own: the program installs
# one as the process default before connecting (LazyOS installs its
# GPLv2-compatible RustCrypto provider). Trust anchors are the system's CA
# bundle (`SSL_CERT_FILE`, or the usual paths). Exactly one of the two.
rustls = [
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-native-certs",
    "lettre/tokio1-rustls",
    "lettre/rustls-no-provider",
    "lettre/rustls-native-certs",
    "ureq/rustls-no-provider",
]
# Passwords in the platform's credential store: Windows Credential Manager,
# the macOS keychain, or Secret Service over D-Bus on Linux. Without it
# `keyring` falls back to its in-memory mock store unless the program installs
# a credential builder of its own (`keyring::set_default_credential_builder`),
# as LazyOS does. Each backend's crate is gated to its own target inside
# `keyring`, so turning all three on builds only the host's.
os-keyring = ["keyring/windows-native", "keyring/sync-secret-service", "keyring/apple-native"]

[dependencies]
ureq.workspace = true

tokio.workspace = true
tokio-native-tls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
futures.workspace = true

async-imap.workspace = true
mailparse.workspace = true
chrono.workspace = true
twemoji-assets.workspace = true
unicode-segmentation.workspace = true
lettre.workspace = true
ammonia.workspace = true
cssparser.workspace = true
base64.workspace = true

rusqlite.workspace = true
keyring.workspace = true
secrecy.workspace = true
directories.workspace = true
toml.workspace = true

anyhow.workspace = true
serde.workspace = true
url.workspace = true
log.workspace = true
image.workspace = true
sha2.workspace = true
getrandom.workspace = true
serde_json.workspace = true
interprocess.workspace = true

# Tray icon + Windows toast notifications (B10). Windows-only: neither crate
# is even compiled on other platforms, let alone linked.
#
# `keyring`'s real platform credential stores are all opt-in Cargo features;
# with none enabled it silently falls back to an in-memory mock store, which
# once made saved passwords vanish. They are requested by `os-keyring` above.
[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
windows.workspace = true
windows-registry.workspace = true
widestring.workspace = true

[dev-dependencies]
mail-mock-server = { path = "../mail-mock-server" }
# A crypto provider for the tests of the `rustls` backend; never linked into
# the library itself.
rustls = { workspace = true, features = ["ring"] }
# The `toast` example initializes logging.
env_logger.workspace = true
