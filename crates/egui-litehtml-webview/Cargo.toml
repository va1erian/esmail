[package]
name = "egui-litehtml-webview"
description = "An egui widget that renders HTML/CSS via litehtml. Internal to this workspace."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
egui.workspace = true
litehtml.workspace = true
url.workspace = true
log.workspace = true
image.workspace = true
# System font discovery for the `Painter` backend (see `src/fonts.rs`). Same
# versions cosmic-text (the Pixbuf backend's text stack) already pulls in, so
# these add no new crates to the graph.
fontdb = { version = "0.16", default-features = false, features = ["std", "fs", "memmap"] }
ttf-parser = { version = "0.20", default-features = false, features = ["std"] }

[dev-dependencies]
eframe.workspace = true
env_logger.workspace = true

[[example]]
name = "two_views"
