[package]
name = "egui-litehtml-webview"
description = "An egui widget that renders HTML/CSS via litehtml. Internal to this workspace."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
egui.workspace = true
litehtml.workspace = true
url.workspace = true
log.workspace = true
image.workspace = true
# System font discovery (see `src/fonts.rs`).
fontdb = { version = "0.16", default-features = false, features = ["std", "fs", "memmap"] }
ttf-parser = { version = "0.20", default-features = false, features = ["std", "variable-fonts"] }

[dev-dependencies]
eframe.workspace = true
env_logger.workspace = true

[[example]]
name = "two_views"
